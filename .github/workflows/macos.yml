name: macOS build

# Сборка на настоящем Mac: штатная подпись codesign, установщики .dmg, zip для автообновления
# и пробный запуск со снимками экрана (артефакт "smoke").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow
        run: pip install pillow

      - name: Ядро (Xray-core, sing-box) со сверкой SHA-256
        run: sh Runtime/fetch.sh

      - name: Сборка arm64 и x64
        run: python build-macos.py arm64 x64

      - name: Пробный запуск
        run: bash packaging/smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
